<!-- Form with proper submit handling -->
<form [formGroup]="setupForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="mb-3">
    <label for="userName" class="form-label">Username</label>
    <input
      type="text"
      id="userName"
      class="form-control"
      formControlName="userName"
    />
  </div>

  <!-- Trigger modal and submit via button -->
  <button
    type="submit"
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#exampleModal"
  >
    SetUp 2FA
  </button>
</form>

<!-- Modal -->
<div
  class="modal fade"
  id="exampleModal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Scan QR Code</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body text-center">
        <img [src]="qrCodeBase64" class="img-fluid" />
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
