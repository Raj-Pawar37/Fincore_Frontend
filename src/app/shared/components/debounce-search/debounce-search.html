<div class="input-group">

  <span class="input-group-text bg-white">
    <i class="bi bi-search"></i>
  </span>

  <input type="text" class="form-control" [formControl]="searchControl"[placeholder]="placeholder()">

  @if (searchControl.value) {
    <button type="button" class="btn btn-outline-secondary" title="Clear search" (click)="clearSearch()">
      <i class="bi bi-x-lg"></i>
    </button>
  }

</div>
