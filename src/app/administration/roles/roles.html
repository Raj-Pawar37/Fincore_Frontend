
<h1> Role Data </h1>
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col">Role ID</th>
              <th scope="col">Role Name</th>
              <th scope="col">Description</th>
              <th scope="col">Role Code</th>
              <th scope="col">Active Status</th>
              <th scope="col" class="text-center">Action</th>
            </tr>
          </thead> 
          <tbody>
            @for (element of dataSource; track element.roleId) {
              <tr>
                <td>{{ element.roleId }}</td>
                <td>{{ element.roleName }}</td>
                <td>{{ element.roleDescription }}</td>
                <td>{{ element.roleCode }}</td>
                <td>
                  <span class="badge" [ngClass]="element.isActive ? 'bg-success' : 'bg-danger'">
                    {{ element.isActive ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="text-center">
                  <button class="btn btn-sm btn-primary me-2">
                    Edit
                  </button>
                  <button class="btn btn-sm btn-danger" >
                    Delete
                  </button>
                </td>
              </tr>
            } 
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
