<div class="login-page">
  <div class="login-card">
    <div class="login-header text-center">
      <div class="logo-box">
        <i class="bi bi-building"></i>
      </div>

      <h2>Verify 2FA OTP</h2>

      <p class="text-muted">Sign in to continue</p>
    </div>

    <form [formGroup]="optForm" (ngSubmit)="onSubmit(optForm.value)" novalidate>
      <div class="mb-3">
        <div class="mb-3">
          <label for="password" class="form-label"> Enter OTP </label>

          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="text"
              value="{{ userName }}"
              formControlName="userName"
            />

            <input
              id="password"
              type="text"
              class="form-control"
              formControlName="otp"
              placeholder="Enter OTP"
              autocomplete="current-password"
            />

            <div class="invalid-feedback">OTP is required.</div>
          </div>
        </div>

        <input type="submit" value="veriy OTP" class="btn btn-primary" />
      </div>
    </form>

    <div class="login-footer text-center">
      <small class="text-muted"> © 2026 Fincore ERP </small>
    </div>
  </div>
</div>
